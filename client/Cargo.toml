[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
# Keep the Bevy name visible to its derive-macro crate resolver on every target.
bevy = { version = "0.19.1", default-features = false, features = ["jpeg"] }
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
shared = { path = "../shared" }
omoba-passport = { path = "../passport" }
winit.workspace = true

# Desktop and iOS use Bevy defaults; Android selects NativeActivity explicitly.
[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { workspace = true, features = ["jpeg"] }
ekza-bevy-sdk = { git = "https://github.com/ekza-space/ekza-bevy-sdk", rev = "28205aedc8666d93b7ada8c94814d92577f65eaf" }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app", "2d_bevy_render", "3d_bevy_render", "ui_bevy_render",
    "scene", "audio", "picking", "std", "bevy_winit", "default_font",
    "multi_threaded", "android-native-activity", "jpeg",
] }
# Identity and validation are platform-independent. The legacy empty model catalog
# is provided locally on Android, avoiding the SDK's desktop-only download stack.
ekza-bevy-sdk = { git = "https://github.com/ekza-space/ekza-bevy-sdk", rev = "28205aedc8666d93b7ada8c94814d92577f65eaf", default-features = false }

[lints]
workspace = true
