[package]
name = "server"
default-run = "server"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"] }
tokio = { version = "1.49.0", features = ["rt", "time", "sync", "macros"] }
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
bevy = { version = "0.18.0", default-features = false, features = ["std"] }
ekza-bevy-sdk = { git = "https://github.com/ekza-space/ekza-bevy-sdk", rev = "42c39e4bf5aea2e3a051f86ba27cbf6e2c46d377", default-features = false }
serde.workspace = true
serde_json.workspace = true
shared = { path = "../shared" }
omoba-passport = { path = "../passport" }

[lints]
workspace = true
