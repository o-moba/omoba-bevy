[package]
name = "ekza-stellar-sdk"
version.workspace = true
edition.workspace = true
description = "SDK surface for Ekza-Stellar character ids and Bevy 3D model integration"

[features]
default = ["bevy"]
bevy = ["dep:bevy", "dep:reqwest"]

[dependencies]
bevy = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
