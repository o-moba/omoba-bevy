name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: catches flakes and drift in the PostgreSQL-backed tests between merges.
  schedule:
    - cron: "23 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: fmt, clippy, tests
    # Pinned, not ubuntu-latest: the Elite trace baseline is keyed by this
    # image's libm (glibc 2.39), so an image change must be a deliberate edit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Clippy, client without the qa feature
        run: cargo clippy -p client --lib --no-deps --no-default-features -- -D warnings
      - name: Unit and integration tests
        # The runner (ubuntu 24.04, glibc 2.39) has an Elite trace baseline,
        # so the trace comparison must run, not skip (docs/plans/bot-personas.md).
        # The trace this run recorded is uploaded, also on failure, so an
        # intended gameplay change can re-baseline without a 2.39 machine
        # (module docs of common/src/bots_trace_tests.rs).
        env:
          OMOBA_REQUIRE_BOT_TRACE: "1"
          OMOBA_BOT_TRACE_OUT: ${{ runner.temp }}/elite_bot_trace.txt
          OMOBA_BOT_TRACE_LABEL: ubuntu 24.04, glibc 2.39 (CI runner)
        run: cargo test --workspace --locked --exclude harness
      - name: Upload the Elite trace this run recorded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-bot-trace
          path: ${{ runner.temp }}/elite_bot_trace.txt
          if-no-files-found: ignore

  bot-sim:
    name: bot difficulty smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # A small fixed-seed sample of full bot rounds, interval assertions only.
      # The full matrix is bot-sim.yml (workflow_dispatch) or the dev VPS builder.
      - name: Difficulty simulator smoke
        run: cargo test --release --locked -p common --features test-support --test bot_difficulty_sim -- --ignored smoke_

  dev-contour:
    # The OMOBA Dev app's code paths (BUILD_CONTOUR = Some("dev"): the Dev, Local
    # and Custom connection profiles, per-profile folders, the connection panel)
    # only exist in a client compiled with the dev defaults of scripts/contours.py.
    name: client in the dev contour
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMOBA_ACCOUNT_API_URL: https://account.dev.omoba.io
      OMOBA_PORTAL_ORIGIN: https://app.dev.omoba.io
      OMOBA_DEFAULT_CONFIG_DIR_SUFFIX: dev
      OMOBA_DEFAULT_GAME_SERVER_ADDR: lobby.dev.omoba.io:4100
      OMOBA_DEFAULT_REGISTRY_URL: https://registry.dev.ekza.io
      OMOBA_DEFAULT_PASSPORT_URL: http://127.0.0.1:9/api/passport
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Keep the settings folder in a scratch directory
        run: echo "OMOBA_CLIENT_CONFIG_DIR=$RUNNER_TEMP/omoba-dev-settings" >> "$GITHUB_ENV"
      - name: Clippy (warnings are errors)
        run: cargo clippy -p client --all-targets --no-deps --locked -- -D warnings
      - name: Clippy, client without the qa feature
        run: cargo clippy -p client --lib --no-deps --no-default-features --locked -- -D warnings
      - name: Client tests
        run: cargo test -p client --locked

  harness:
    name: headless gameplay harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the server the harness launches
        run: cargo build --locked -p server
      - name: Harness tests (serial; each test owns a loopback server)
        run: cargo test --locked -p harness -- --test-threads=1

  postgres:
    name: postgres-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omoba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omoba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable service database. scripts/postgres_tests.py migrates it,
      # creates the restricted runtime roles, and sets OMOBA_REQUIRE_TEST_DATABASE
      # so tests that skip without a URL fail here instead.
      OMOBA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/omoba_test
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev, psql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config postgresql-client
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: career-store, account-api and server tests, ignored ones included
        run: python3 scripts/postgres_tests.py

  android:
    name: android compile check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # `cargo check` never links, but blake3, ring (C) and oboe-sys (C++,
      # AAudio headers) compile native code in build scripts, so the NDK's
      # clang and sysroot are required. The runner image ships an NDK.
      - name: Point cc-rs at the preinstalled NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$ndk" || { echo "no Android NDK on this runner"; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: cargo check the client for Android
        run: cargo check -p client --target aarch64-linux-android --locked

  scripts:
    name: python tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launcher, packaging and asset-gate tests
        # The asset-gate tests run; only the renamed-denied-binary test skips,
        # because a shallow checkout has no copy of the denied files (O6).
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: iOS packaging tool tests
        run: python3 -m unittest discover -s mobile/ios -p 'test_*.py'
      - name: Android packaging tool tests
        run: python3 -m unittest discover -s mobile/android -p 'test_*.py'
