name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: catches flakes and drift in the PostgreSQL-backed tests between merges.
  schedule:
    - cron: "23 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Clippy, client without the qa feature
        run: cargo clippy -p client --lib --no-deps --no-default-features -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --locked --exclude harness

  harness:
    name: headless gameplay harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the server the harness launches
        run: cargo build --locked -p server
      - name: Harness tests (serial; each test owns a loopback server)
        run: cargo test --locked -p harness -- --test-threads=1

  postgres:
    name: postgres-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omoba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omoba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable service database. scripts/postgres_tests.py migrates it,
      # creates the restricted runtime roles, and sets OMOBA_REQUIRE_TEST_DATABASE
      # so tests that skip without a URL fail here instead.
      OMOBA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/omoba_test
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev, psql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config postgresql-client
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: career-store, account-api and server tests, ignored ones included
        run: python3 scripts/postgres_tests.py

  scripts:
    name: python tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launcher, packaging and asset-gate tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
