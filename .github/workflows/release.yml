name: Release

# Builds every desktop and Android package and attaches them to a DRAFT
# GitHub release. Publishing stays a manual click (or
# `gh release edit <tag> --draft=false`). iPhone builds need the Apple team
# and are made locally: `python3 scripts/release.py build ios --upload`.
#
# Trigger: push a tag `v*`, or run it by hand (Actions -> Release -> Run
# workflow / `python3 scripts/release.py ci`).
#
# DEV-contour tester packages (the OMOBA Dev app: desktop -dev packages and the
# space.ekza.omoba.dev APK; dev lobby lobby.dev.omoba.io:4100 on the dedicated dev
# VPS + registry.dev.ekza.io; separate settings folder; -dev file names; built from
# the dev branch) only go to a v<version>-dev.N tag:
#   python3 scripts/release.py ci --contour dev --ref v0.45.0-dev.1
# A pushed v*-dev* tag builds production packages and then fails the draft step.
on:
  push:
    tags: ["v*"]
  # Release tooling changes build every package (no release is created).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.py"
      - "mobile/android/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.24.0)"
        required: true
      server:
        description: "Initial game server host:port compiled into clients (optional)"
        required: false
        default: ""
      registry:
        description: "Initial Ekza registry URL compiled into clients (optional; dev defaults to https://registry.dev.ekza.io)"
        required: false
        default: ""
      contour:
        description: "prod (public beta) or dev (dev lobby + dev registry, desktop only, v<version>-dev.N tags)"
        required: false
        default: prod
        type: choice
        options: [prod, dev]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_CONTOUR: ${{ github.event.inputs.contour || 'prod' }}
  # Pull-request runs only prove the packages build. The repository default
  # server is for production packages; a dev package defaults to the dev lobby.
  RELEASE_SERVER: ${{ github.event.inputs.server || (github.event.inputs.contour != 'dev' && vars.OMOBA_RELEASE_SERVER || '') }}
  RELEASE_REGISTRY: ${{ github.event.inputs.registry }}

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # Byte-exact checkout: the asset gate pins file hashes (no CRLF rewrite).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the ${{ matrix.platform }} package
        shell: bash
        run: |
          args=(build "${{ matrix.platform }}" --out dist --contour "$RELEASE_CONTOUR")
          if [ -n "$RELEASE_SERVER" ]; then args+=(--server "$RELEASE_SERVER"); fi
          if [ -n "$RELEASE_REGISTRY" ]; then args+=(--registry "$RELEASE_REGISTRY"); fi
          python scripts/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omoba-${{ matrix.platform }}
          path: |
            dist/*/*.zip
            dist/*/*.tar.gz
          if-no-files-found: error
          # Packages also reach the draft release; the artifacts only hand them
          # between jobs, so keep them briefly instead of the 90-day default.
          retention-days: 3

  android:
    name: android
    # A dev-contour APK is the separate OMOBA Dev app (space.ekza.omoba.dev), so it
    # installs beside the production app instead of over it.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages the packager expects
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Build the Android package
        env:
          # Optional: a stable signing key so updates install over each other.
          OMOBA_ANDROID_KEYSTORE_BASE64: ${{ secrets.OMOBA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          args=(build android --out dist --contour "$RELEASE_CONTOUR")
          if [ -n "$RELEASE_SERVER" ]; then args+=(--server "$RELEASE_SERVER"); fi
          if [ -n "$RELEASE_REGISTRY" ]; then args+=(--registry "$RELEASE_REGISTRY"); fi
          python3 scripts/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omoba-android
          path: dist/*/*.apk
          if-no-files-found: error
          retention-days: 3

  draft:
    name: draft release
    needs: [desktop, android]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep dev packages off production tags and production packages off dev tags
        run: |
          if [ "$RELEASE_CONTOUR" = dev ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || { echo "dev packages need a v<version>-dev.N tag, got $RELEASE_TAG"; exit 1; }
          else
            [[ "$RELEASE_TAG" != *-dev* ]] || { echo "$RELEASE_TAG is a dev tag; run with contour=dev"; exit 1; }
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: omoba-*
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -exec cp {} upload/ \;
          ls -la upload
          test -n "$(ls upload)"
          (cd upload && sha256sum * > SHA256SUMS.txt)
          python3 scripts/release.py notes > notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="OMOBA ${RELEASE_TAG#v} (playtest)"
          if [ "$RELEASE_CONTOUR" = dev ]; then title="OMOBA ${RELEASE_TAG#v} DEV (test contour)"; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" upload/* --clobber
          else
            gh release create "$RELEASE_TAG" upload/* --draft --prerelease \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          fi
          echo "Draft ready: $(gh release view "$RELEASE_TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
