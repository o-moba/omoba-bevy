name: Release

# Builds every desktop and Android package and attaches them to a DRAFT
# GitHub release. Publishing stays a manual click (or
# `gh release edit <tag> --draft=false`). iPhone builds need the Apple team
# and are made locally: `python3 scripts/release.py build ios --upload`.
#
# Trigger: push a tag `v*`, or run it by hand (Actions -> Release -> Run
# workflow / `python3 scripts/release.py ci`).
on:
  push:
    tags: ["v*"]
  # Release tooling changes build every package (no release is created).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.py"
      - "mobile/android/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.24.0)"
        required: true
      server:
        description: "Initial game server host:port compiled into clients (optional)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Pull-request runs only prove the packages build.
  RELEASE_SERVER: ${{ github.event.inputs.server || vars.OMOBA_RELEASE_SERVER }}

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (audio, udev)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the ${{ matrix.platform }} package
        shell: bash
        run: |
          args=(build "${{ matrix.platform }}" --out dist)
          if [ -n "$RELEASE_SERVER" ]; then args+=(--server "$RELEASE_SERVER"); fi
          python scripts/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omoba-${{ matrix.platform }}
          path: |
            dist/*/*.zip
            dist/*/*.tar.gz
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages the packager expects
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Build the Android package
        env:
          # Optional: a stable signing key so updates install over each other.
          OMOBA_ANDROID_KEYSTORE_BASE64: ${{ secrets.OMOBA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          args=(build android --out dist)
          if [ -n "$RELEASE_SERVER" ]; then args+=(--server "$RELEASE_SERVER"); fi
          python3 scripts/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omoba-android
          path: dist/*/*.apk
          if-no-files-found: error

  draft:
    name: draft release
    needs: [desktop, android]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: omoba-*
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -exec cp {} upload/ \;
          ls -la upload
          test -n "$(ls upload)"
          (cd upload && sha256sum * > SHA256SUMS.txt)
          python3 scripts/release.py notes > notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" upload/* --clobber
          else
            gh release create "$RELEASE_TAG" upload/* --draft --prerelease \
              --target "$GITHUB_SHA" --title "OMOBA ${RELEASE_TAG#v} (playtest)" --notes-file notes.md
          fi
          echo "Draft ready: $(gh release view "$RELEASE_TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
