[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
flate2 = { version = "=1.1.0", default-features = false, features = ["rust_backend"] }

# Reuse the pinned engine's browser clock. Native shared stays renderer-free and
# keeps exactly std::time::Instant; no networking or identity contract changes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "web"] }

[lints]
workspace = true
