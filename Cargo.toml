[workspace]
members = ["account-api", "arena-sync", "career-store", "client", "harness", "passport", "server", "shared"]
resolver = "2"

[workspace.package]
version = "0.24.0"
edition = "2024"
license = "MPL-2.0"

# Bevy-style codebase: systems legitimately take many params and complex query
# types, and `if let`+condition nesting is used for readability. These style
# lints fire on long-standing code with the current clippy; keep them allowed
# workspace-wide so `clippy -D warnings` gates real issues only.
[workspace.lints.clippy]
collapsible_if = "allow"
# Wire and UI action enums carry one payload per request; boxing the largest
# variant buys nothing on the wire and hides the shape of the message.
large_enum_variant = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
bevy = "0.18.0"
crossbeam-channel = "0.5.15"
# One pinned SDK revision for every crate. Its features are opt-in per crate:
# the desktop client takes the defaults (Bevy helpers, HTTP), passport `http`.
ekza-bevy-sdk = { git = "https://github.com/ekza-space/ekza-bevy-sdk", rev = "247ddbf6dbfc9bac95b52b74ce3a0a1321466a24", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
winit = "=0.30.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
