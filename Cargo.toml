[workspace]
members = ["arena-sync", "client", "harness", "server", "shared", "skills"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"

# Bevy-style codebase: systems legitimately take many params and complex query
# types, and `if let`+condition nesting is used for readability. These style
# lints fire on long-standing code with the current clippy; keep them allowed
# workspace-wide so `clippy -D warnings` gates real issues only.
[workspace.lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
bevy = "0.18.0"
crossbeam-channel = "0.5.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
winit = "=0.30.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
