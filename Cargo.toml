[workspace]
members = ["account-api", "arena-sync", "career-store", "client", "common", "harness", "passport", "server", "shared"]
resolver = "2"

[workspace.package]
version = "0.44.0"
edition = "2024"
license = "MPL-2.0"

# Bevy-style codebase: systems legitimately take many params and complex query
# types, and `if let`+condition nesting is used for readability. These style
# lints fire on long-standing code with the current clippy; keep them allowed
# workspace-wide so `clippy -D warnings` gates real issues only.
[workspace.lints.clippy]
collapsible_if = "allow"
# Wire and UI action enums carry one payload per request; boxing the largest
# variant buys nothing on the wire and hides the shape of the message.
large_enum_variant = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
bevy = "0.19.1"
crossbeam-channel = "0.5.15"
# One pinned SDK revision for every crate. Its features are opt-in per crate:
# the desktop client takes the defaults (Bevy helpers, HTTP), passport `http`.
ekza-bevy-sdk = { git = "https://github.com/ekza-space/ekza-bevy-sdk", rev = "a9a253cba110bcb308a7f81f6dfb5a4b2243f545", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
winit = "=0.30.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Linux audio: cpal 0.17.3 spins its realtime ALSA worker on POLLERR (PipeWire
# xrun/suspend), freezing the desktop. Local backport of the cpal 0.18 recovery;
# drop when bevy_audio moves to rodio/cpal 0.18. See third_party/cpal-0.17.3/OMOBA-PATCH.md.
[patch.crates-io]
cpal = { path = "third_party/cpal-0.17.3" }
