[workspace]
members = ["client", "harness", "server", "skills"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
bevy = "0.18.0"
crossbeam-channel = "0.5.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
winit = "=0.30.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
