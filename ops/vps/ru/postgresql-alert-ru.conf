# Owner alert for a failed PostgreSQL cluster (LR-17). Ubuntu's postgresql.service is only
# postgresql-common's wrapper (a oneshot that stays active); each cluster runs as
# postgresql@<version>-<name>.service, with no Restart=. This drop-in for the template gives
# every cluster unit the alert every RU unit names, so a crashed database alerts at once,
# under the same code as the host check's "not running" (one message, not two).
# Installed by ops/vps/ru/ru_host.py bootstrap as
# /etc/systemd/system/postgresql@.service.d/50-omoba-ru-alert.conf (README.md,
# "Monitoring and alerts").
[Unit]
OnFailure=omoba-alert-ru@%n.service
