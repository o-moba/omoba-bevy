#!/usr/sbin/nft -f
# OMOBA RU host: per-source UDP limits in front of the lobby and the match
# workers (LR-16). Loaded by omoba-limits-ru.service, installed by
# `ru_host.py bootstrap`; knobs in ops/vps/ru/README.md ("Admission limits").
#
# Only this table is touched: never `flush ruleset`, which would also drop
# ufw's rules. Reloading replaces the table atomically.
#
# The kernel drops a source's UDP datagrams beyond the rates below before the
# game sees them; the game then applies its own per-IP, per-network and
# global budgets. The rates are per source address, so a household or a
# carrier-grade NAT shares one budget: they sit well above what eight players
# on one address send (the game's own per-endpoint limit is 120 datagrams/s).

# The lobby port and the arena range must match omoba-lobby-ru.service
# (OMOBA_MATCH_FIRST_PORT .. + OMOBA_MATCH_CAPACITY - 1); ru_host.py refuses
# a kit where they differ.
define OMOBA_LOBBY_PORT = 4000
define OMOBA_ARENA_PORTS = 41000-41001

table inet omoba_limits
delete table inet omoba_limits

table inet omoba_limits {
	# One element per source, forgotten a minute after its last datagram.
	set lobby_v4 {
		type ipv4_addr
		size 65535
		flags dynamic,timeout
		timeout 1m
	}
	set lobby_v6 {
		type ipv6_addr
		size 65535
		flags dynamic,timeout
		timeout 1m
	}
	set arena_v4 {
		type ipv4_addr
		size 65535
		flags dynamic,timeout
		timeout 1m
	}
	set arena_v6 {
		type ipv6_addr
		size 65535
		flags dynamic,timeout
		timeout 1m
	}

	# Rates per source address (datagrams per second, burst): the lobby 400
	# (800), the arenas 1200 (2400). Edit them here; README "Admission limits".
	chain input {
		# Before ufw's chains; an accept here does not bypass them.
		type filter hook input priority filter - 10; policy accept;
		udp dport $OMOBA_LOBBY_PORT update @lobby_v4 { ip saddr limit rate over 400/second burst 800 packets } counter drop comment "omoba lobby: per-source limit"
		udp dport $OMOBA_LOBBY_PORT update @lobby_v6 { ip6 saddr limit rate over 400/second burst 800 packets } counter drop comment "omoba lobby: per-source limit"
		udp dport $OMOBA_ARENA_PORTS update @arena_v4 { ip saddr limit rate over 1200/second burst 2400 packets } counter drop comment "omoba arenas: per-source limit"
		udp dport $OMOBA_ARENA_PORTS update @arena_v6 { ip6 saddr limit rate over 1200/second burst 2400 packets } counter drop comment "omoba arenas: per-source limit"
	}
}
