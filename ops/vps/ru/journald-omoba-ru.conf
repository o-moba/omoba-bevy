# /etc/systemd/journald.conf.d/50-omoba-ru.conf — the RU host's journal limits (LR-17).
# Installed by ops/vps/ru/ru_host.py bootstrap, which restarts systemd-journald after a change.
# The journal holds every RU unit's output; some lobby and Account API lines carry a
# player's IP address, so it is kept at most 30 days (one file a day, so whole days age
# out) and 1 GiB. The privacy policy (LR-04) names this retention.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=64M
MaxFileSec=1day
MaxRetentionSec=30day
